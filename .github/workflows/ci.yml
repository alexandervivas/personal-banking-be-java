name: api-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  discover-projects:
    name: Discover Gradle projects
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine modules
        id: set-matrix
        run: |
          projects=$(python - <<'PY'
          import json
          import pathlib

          projects = []
          modules_dir = pathlib.Path("modules")
          if modules_dir.exists():
              projects.extend(
                  sorted(
                      module.name
                      for module in modules_dir.iterdir()
                      if module.is_dir() and not module.name.startswith(".")
                  )
              )
          print(json.dumps(projects))
          PY
                    )
                    echo "matrix=$projects" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: .pre-commit-config.yaml

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run pre-commit on all files
        run: pre-commit run --all-files

  build-test:
    name: Build and test ${{ matrix.project }}
    needs: discover-projects
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover-projects.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test project
        run: |
          if [ "${{ matrix.project }}" = "root" ]; then
            ./gradlew build
          else
            ./gradlew :modules:${{ matrix.project }}:build
          fi
