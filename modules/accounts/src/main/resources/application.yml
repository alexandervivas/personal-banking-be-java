server:
  port: ${ACCOUNTS_HTTP_PORT:8081}

spring:
  application:
    name: accounts
  datasource:
    url: jdbc:h2:mem:accountsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

messaging:
  events:
    exchange-prefix: ${EVENTS_EXCHANGE_PREFIX:events.v1.}
    routing-key: ${EVENTS_ROUTING_KEY:events}

grpc:
  server:
    port: ${ACCOUNTS_GRPC_PORT:9092}

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: ${EUREKA_REGISTER:true}
    fetch-registry: ${EUREKA_FETCH:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
