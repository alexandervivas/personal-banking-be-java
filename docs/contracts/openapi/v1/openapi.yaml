openapi: 3.0.3
info:
  title: Personal Banking API
  version: 1.0.0
paths:
  /v1/tenants:
    post:
      summary: Create tenant
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
          required: true
      responses:
        "201": { description: Created }
        "400": { description: Problem Details }
  /v1/accounts:
    post:
      summary: Create account
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
          required: true
      responses:
        "201": { description: Created }
  /v1/banks:
    post:
      summary: Create bank (tenant-scoped)
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
          required: true
      responses:
        "201": { description: Created }
  /v1/transactions:
    post:
      summary: Create transaction (with bankId)
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
          required: true
      responses:
        "201": { description: Created }
components:
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
